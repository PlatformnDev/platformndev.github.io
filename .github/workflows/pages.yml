name: Prepare GitHub Pages files
# Build only. Publishing remains stopped until an administrator sets up
# PlatformnDev.github.io and explicitly publishes the remove-bg directory.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for the organization site path
        run: npm run build -- --base=/remove-bg/
      - name: Assemble organization site files
        run: |
          mkdir -p pages/remove-bg
          cp -R dist/. pages/remove-bg/
          touch pages/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: remove-bg-pages
          path: pages
          include-hidden-files: true
          retention-days: 7
