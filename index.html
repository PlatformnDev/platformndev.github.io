<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="이미지를 서버에 보내지 않는 브라우저 배경 제거 도구"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><title>Clearcut — 이미지 배경 제거</title></head><body><div id="app"><header><a class="brand" href="/">Clearcut<span class="brand-dot">.</span></a><span class="header-note">이미지 배경 제거</span></header><main><div class="intro"><span class="eyebrow">당신의 이미지, 필요한 부분만.</span><h1>배경은 지우고, <br>피사체는 또렷하게.</h1><p>이미지를 놓으면 배경을 투명하게 만들어 드려요.</p></div><section id="workspace" aria-label="이미지 배경 제거"><label class="dropzone" id="dropzone" for="file"><span class="upload-icon" aria-hidden="true">↥</span><strong>이미지를 여기에 놓아주세요</strong><span>또는 파일을 선택해서 시작하세요</span><span class="button">이미지 선택</span><small>JPG · PNG · WebP · AVIF · BMP · GIF<br>최대 20MB · 한 번에 한 장</small><input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.avif,.bmp,.gif" aria-label="이미지 선택"></label><div id="editor" hidden></div><p id="status" role="status" aria-live="polite"></p><div id="actions"></div></section><p class="privacy"><span aria-hidden="true">◇</span> 이미지는 서버로 전송되지 않고 이 브라우저에서 처리됩니다.</p><aside class="details"><div><span>01</span><strong>이미지 선택</strong><p>평소 사용하는 이미지 그대로</p></div><div><span>02</span><strong>자동 배경 제거</strong><p>설정 없이, 브라우저 안에서</p></div><div><span>03</span><strong>투명 PNG 저장</strong><p>원본 크기를 유지한 결과물</p></div></aside></main><footer><span>Clearcut</span><span>가볍게 시작하고, 깔끔하게 마무리하세요.</span><a href="/licenses.txt">오픈소스 안내</a></footer></div><script type="module" src="/src/main.ts"></script></body></html>
